<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FileSalad">
  <title>FileSalad</title>
  <!-- Accent-green rounded tile (matches --fs-accent #16A34A). -->
  <rect width="64" height="64" rx="14" fill="#16A34A"/>
  <!-- Salad mark inspired by lucide's Salad icon: bowl + two leaves +
       a sprout. Stroke + fill flattened for crispness at 16x16. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bowl rim -->
    <path d="M14 36h36"/>
    <!-- Bowl -->
    <path d="M16 36c0 8.8 7.2 16 16 16s16-7.2 16-16"/>
    <!-- Leaves above the rim -->
    <path d="M24 36c-3-2-4.5-5-3-8 3-1.5 7 0 9 3"/>
    <path d="M40 36c3-2 4.5-5 3-8-3-1.5-7 0-9 3"/>
    <!-- Sprout / center leaf -->
    <path d="M32 36c0-6 0-10 2-13"/>
    <path d="M32 23c-3-1-4-3-3-6 3 0 5 1 6 4"/>
  </g>
</svg>
