<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>FileSalad — Drop a file, get a public link</title>
    <meta
      name="description"
      content="Turn any file into a short, shareable link in two clicks. No signup, links expire automatically."
    />
    <meta name="theme-color" content="#16A34A" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://usefilesalad.xyz/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FileSalad" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://usefilesalad.xyz/" />
    <meta property="og:title" content="FileSalad — Drop a file, get a public link" />
    <meta
      property="og:description"
      content="Turn any file into a short, shareable link in two clicks. No signup, links expire automatically."
    />
    <meta property="og:image" content="https://usefilesalad.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FileSalad — drop a file, get a public link" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FileSalad — Drop a file, get a public link" />
    <meta
      name="twitter:description"
      content="Turn any file into a short, shareable link in two clicks. No signup, links expire automatically."
    />
    <meta name="twitter:image" content="https://usefilesalad.xyz/og-image.png" />
    <meta name="twitter:image:alt" content="FileSalad — drop a file, get a public link" />

    <!-- Structured data (rich result eligibility for app-style pages) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FileSalad",
        "url": "https://usefilesalad.xyz/",
        "description": "Turn any file into a short, shareable link in two clicks. No signup, links expire automatically.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
